<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Payly Fluent — revisión</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#0f1115; --card:#1a1d24; --fg:#f3f4f6; --muted:#9ca3af;
      --accent:#0f6cbd; --border:#2a2f3a; --chip:#252a33;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
    header {
      padding:14px 16px 10px; position:sticky; top:0; z-index:3;
      background:rgba(15,17,21,.94); backdrop-filter:blur(8px);
      border-bottom:1px solid var(--border);
    }
    h1 { font-size:1.1rem; margin:0 0 2px; font-weight:600; }
    p.sub { margin:0; color:var(--muted); font-size:.82rem; }
    .row { display:flex; gap:8px; overflow-x:auto; padding:10px 16px 0; -webkit-overflow-scrolling:touch; }
    .row:last-of-type { padding-bottom:10px; }
    .row button {
      flex:0 0 auto; border:1px solid var(--border); background:var(--card); color:var(--fg);
      border-radius:999px; padding:8px 14px; font-size:.82rem;
    }
    .row.modules button { font-weight:600; }
    .row button[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
    .row.groups button { background:var(--chip); font-size:.78rem; padding:6px 12px; }
    .row.groups button[aria-selected="true"] { background:#1b4f82; border-color:#1b4f82; }
    .crumb { padding:8px 16px 0; color:var(--muted); font-size:.75rem; }
    .crumb strong { color:var(--fg); font-weight:600; }
    main { padding:12px 16px 48px; max-width:720px; margin:0 auto; }
    .pair { display:grid; gap:12px; }
    figure { margin:0; background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    figcaption { padding:10px 12px; font-size:.8rem; color:var(--muted); border-bottom:1px solid var(--border); }
    img { display:block; width:100%; height:auto; background:#000; }
    .empty { color:var(--muted); padding:24px 8px; text-align:center; margin:0; }
    footer { padding:24px 16px; color:var(--muted); font-size:.75rem; text-align:center; }
  </style>
</head>
<body>
  <header>
    <h1>Payly · Fluent</h1>
    <p class="sub">Antes / después por módulo · móvil</p>
  </header>

  <nav class="row modules" id="modules" aria-label="Módulos"></nav>
  <nav class="row groups" id="groups" aria-label="Secciones" hidden></nav>
  <nav class="row pages" id="pages" aria-label="Pantallas"></nav>
  <p class="crumb" id="crumb"></p>

  <main id="main"><p class="empty">Cargando capturas.</p></main>
  <footer>soyache/payly-fluent-review · Inventario listo · Inventario · Supervisor · Reportes</footer>

  <script>
    /**
     * path = relative to before/ and after/ (no extension)
     * group = optional submenu within a module (e.g. Reimpresiones)
     */
    const MODULES = [
      {
        id: 'inventario',
        label: 'Inventario',
        pages: [
          { id: 'productos', label: 'Productos', path: 'productos' },
          { id: 'productos-inhabilitados', label: 'Inhabilitados', path: 'productos-inhabilitados' },
          { id: 'edicion-integral', label: 'Edición integral', path: 'edicion-integral' },
          { id: 'cargar-productos', label: 'Cargar productos', path: 'cargar-productos' },
          { id: 'ingreso-facturas', label: 'Ingreso de facturas', path: 'ingreso-facturas' },
          { id: 'pre-entrada', label: 'Pre entrada', path: 'pre-entrada' },
          { id: 'correccion-costos', label: 'Corrección de costos', path: 'correccion-costos' },
          { id: 'facturas-ingresadas', label: 'Facturas ingresadas', path: 'facturas-ingresadas' },
          { id: 'traslados', label: 'Traslados', path: 'traslados' },
          { id: 'vencimientos', label: 'Vencimientos', path: 'vencimientos' },
          { id: 'bajas-inventario', label: 'Bajas por desecho', path: 'bajas-inventario' }
        ]
      },
      {
        id: 'supervisor',
        label: 'Supervisor',
        pages: [
          { id: 'hub', label: 'Inicio', path: 'supervisor/hub', group: 'Hub' },
          { id: 'autorizar-cierres', label: 'Autorizar cierres', path: 'supervisor/autorizar-cierres', group: 'Autorizar cierres' },
          { id: 'reimpresiones-envios', label: 'Envíos', path: 'supervisor/reimpresiones-envios', group: 'Reimpresiones' },
          { id: 'reimpresiones-cierres', label: 'Cierres', path: 'supervisor/reimpresiones-cierres', group: 'Reimpresiones' },
          { id: 'reimpresiones-ventas', label: 'Ventas', path: 'supervisor/reimpresiones-ventas', group: 'Reimpresiones' },
          { id: 'ventas-crear-anulacion', label: 'Crear anulación', path: 'supervisor/ventas-crear-anulacion', group: 'Ventas' },
          { id: 'ventas-crear-devolucion', label: 'Crear devolución', path: 'supervisor/ventas-crear-devolucion', group: 'Ventas' },
          { id: 'ventas-anular-egresos', label: 'Anular egresos', path: 'supervisor/ventas-anular-egresos', group: 'Ventas' },
          { id: 'ventas-transacciones', label: 'Transacciones', path: 'supervisor/ventas-transacciones', group: 'Ventas' },
          { id: 'ventas-devoluciones', label: 'Devoluciones', path: 'supervisor/ventas-devoluciones', group: 'Ventas' },
          { id: 'ventas-reportes', label: 'Reportes personalizados', path: 'supervisor/ventas-reportes', group: 'Ventas' },
          { id: 'envios', label: 'Envíos', path: 'supervisor/envios', group: 'Envíos' }
        ]
      },
      {
        id: 'reportes',
        label: 'Reportes',
        pages: [
          { id: 'hub', label: 'Inicio', path: 'reportes/hub', group: 'Hub' },
          { id: 'inventario', label: 'Inventario', path: 'reportes/inventario', group: 'Inventario' },
          { id: 'isv', label: 'ISV', path: 'reportes/isv', group: 'ISV' },
          { id: 'utilidad-bruta', label: 'Utilidad bruta', path: 'reportes/utilidad-bruta', group: 'Utilidad bruta' },
          { id: 'productos-problematicos', label: 'Productos problemáticos', path: 'reportes/productos-problematicos', group: 'Productos problemáticos' },
          { id: 'ventas', label: 'Ventas', path: 'reportes/ventas', group: 'Ventas' },
          { id: 'ventas-producto', label: 'Ventas por producto', path: 'reportes/ventas-producto', group: 'Ventas por producto' }
        ]
      }
    ];

    const elModules = document.getElementById('modules');
    const elGroups = document.getElementById('groups');
    const elPages = document.getElementById('pages');
    const elMain = document.getElementById('main');
    const elCrumb = document.getElementById('crumb');

    let moduleId = 'inventario';
    let groupId = null;
    let pageId = null;

    function currentModule() {
      return MODULES.find((m) => m.id === moduleId) || MODULES[0];
    }

    function groupsFor(mod) {
      const seen = [];
      for (const p of mod.pages) {
        const g = p.group || null;
        if (g && !seen.includes(g)) seen.push(g);
      }
      return seen;
    }

    function pagesFor(mod, group) {
      const groups = groupsFor(mod);
      if (!groups.length) return mod.pages;
      const g = group || groups[0];
      return mod.pages.filter((p) => (p.group || null) === g);
    }

    function parseHash() {
      // #supervisor/Reimpresiones/reimpresiones-envios  or  #inventario/productos
      const raw = (location.hash || '').replace(/^#/, '');
      if (!raw) return;
      const parts = raw.split('/').map(decodeURIComponent);
      const m = MODULES.find((x) => x.id === parts[0]);
      if (!m) return;
      moduleId = m.id;
      const groups = groupsFor(m);
      if (groups.length) {
        if (parts[1] && groups.includes(parts[1])) {
          groupId = parts[1];
          pageId = parts[2] || (pagesFor(m, groupId)[0] && pagesFor(m, groupId)[0].id);
        } else if (parts[1]) {
          const hit = m.pages.find((p) => p.id === parts[1]);
          if (hit) {
            groupId = hit.group || groups[0];
            pageId = hit.id;
          } else {
            groupId = groups[0];
            pageId = pagesFor(m, groupId)[0].id;
          }
        } else {
          groupId = groups[0];
          pageId = pagesFor(m, groupId)[0].id;
        }
      } else {
        groupId = null;
        pageId = parts[1] || m.pages[0].id;
      }
    }

    function writeHash() {
      const mod = currentModule();
      const groups = groupsFor(mod);
      let hash = moduleId;
      if (groups.length) {
        hash += '/' + encodeURIComponent(groupId || groups[0]);
        hash += '/' + encodeURIComponent(pageId || '');
      } else if (pageId) {
        hash += '/' + encodeURIComponent(pageId);
      }
      history.replaceState(null, '', '#' + hash);
    }

    function renderModules() {
      elModules.innerHTML = '';
      MODULES.forEach((m) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = m.label;
        b.setAttribute('aria-selected', m.id === moduleId ? 'true' : 'false');
        b.onclick = () => {
          moduleId = m.id;
          const groups = groupsFor(m);
          groupId = groups[0] || null;
          pageId = pagesFor(m, groupId)[0].id;
          paint();
        };
        elModules.appendChild(b);
      });
    }

    function renderGroups() {
      const mod = currentModule();
      const groups = groupsFor(mod);
      elGroups.innerHTML = '';
      if (!groups.length) {
        elGroups.hidden = true;
        return;
      }
      elGroups.hidden = false;
      if (!groupId || !groups.includes(groupId)) groupId = groups[0];
      groups.forEach((g) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = g;
        b.setAttribute('aria-selected', g === groupId ? 'true' : 'false');
        b.onclick = () => {
          groupId = g;
          const list = pagesFor(mod, groupId);
          pageId = list[0] ? list[0].id : null;
          paint();
        };
        elGroups.appendChild(b);
      });
    }

    function renderPages() {
      const mod = currentModule();
      const list = pagesFor(mod, groupId);
      elPages.innerHTML = '';
      if (!list.length) return;
      if (!pageId || !list.some((p) => p.id === pageId)) pageId = list[0].id;
      // If module has no groups and many pages, show all page pills (Inventario)
      // If module has groups and group has only 1 page, still show the pill for clarity
      list.forEach((p) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = p.label;
        b.setAttribute('aria-selected', p.id === pageId ? 'true' : 'false');
        b.onclick = () => {
          pageId = p.id;
          paint();
        };
        elPages.appendChild(b);
      });
      // Hide page row when group has a single page with same label as group (less noise)
      if (list.length === 1 && list[0].group && list[0].label === list[0].group) {
        elPages.hidden = true;
      } else if (list.length === 1 && groupsFor(mod).length && list[0].id === 'hub') {
        elPages.hidden = false;
      } else {
        elPages.hidden = false;
      }
    }

    function renderMain() {
      const mod = currentModule();
      const page = mod.pages.find((p) => p.id === pageId) || pagesFor(mod, groupId)[0];
      if (!page) {
        elMain.innerHTML = '<p class="empty">Sin pantallas en este módulo.</p>';
        elCrumb.textContent = '';
        return;
      }
      const trail = [mod.label];
      if (page.group) trail.push(page.group);
      if (!page.group || page.label !== page.group) trail.push(page.label);
      elCrumb.innerHTML = trail.map((t, i) => (i === trail.length - 1 ? '<strong>' + t + '</strong>' : t)).join(' · ');

      const srcBefore = 'before/' + page.path + '.png';
      const srcAfter = 'after/' + page.path + '.png';
      elMain.innerHTML =
        '<div class="pair">' +
        '<figure><figcaption>Antes · ' + page.label + '</figcaption>' +
        '<img src="' + srcBefore + '" alt="Antes ' + page.label + '" onerror="this.parentElement.innerHTML=\'<figcaption>Antes · ' + page.label + '</figcaption><p class=empty>Pendiente</p>\'" /></figure>' +
        '<figure><figcaption>Después · ' + page.label + '</figcaption>' +
        '<img src="' + srcAfter + '" alt="Después ' + page.label + '" onerror="this.parentElement.innerHTML=\'<figcaption>Después · ' + page.label + '</figcaption><p class=empty>Pendiente</p>\'" /></figure>' +
        '</div>';
    }

    function paint() {
      renderModules();
      renderGroups();
      renderPages();
      renderMain();
      writeHash();
    }

    parseHash();
    paint();
    window.addEventListener('hashchange', () => {
      parseHash();
      paint();
    });
  </script>
</body>
</html>
