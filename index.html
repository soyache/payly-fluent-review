<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Payly Fluent — revisión Inventario</title>
  <style>
    :root { color-scheme: light dark; --bg:#0f1115; --card:#1a1d24; --fg:#f3f4f6; --muted:#9ca3af; --accent:#0f6cbd; --border:#2a2f3a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:16px 16px 8px; position:sticky; top:0; background:rgba(15,17,21,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); z-index:2; }
    h1 { font-size:1.15rem; margin:0 0 4px; font-weight:600; }
    p.sub { margin:0; color:var(--muted); font-size:.85rem; }
    .tabs { display:flex; gap:8px; overflow-x:auto; padding:12px 16px; }
    .tabs button { flex:0 0 auto; border:1px solid var(--border); background:var(--card); color:var(--fg); border-radius:999px; padding:8px 14px; font-size:.85rem; }
    .tabs button[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
    main { padding:12px 16px 40px; max-width:720px; margin:0 auto; }
    .pair { display:grid; gap:12px; }
    figure { margin:0; background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    figcaption { padding:10px 12px; font-size:.8rem; color:var(--muted); border-bottom:1px solid var(--border); }
    img { display:block; width:100%; height:auto; background:#000; }
    .empty { color:var(--muted); padding:24px 8px; text-align:center; }
    footer { padding:24px 16px; color:var(--muted); font-size:.75rem; text-align:center; }
  </style>
</head>
<body>
  <header>
    <h1>Payly · Fluent Inventario</h1>
    <p class="sub">Antes / después — Inventario + Columnas</p>
  </header>
  <nav class="tabs" id="tabs" aria-label="Páginas"></nav>
  <main id="main"><p class="empty">Cargando capturas…</p></main>
  <footer>soyache/payly-fluent-review · se actualiza mientras se afina el módulo</footer>
  <script>
    const PAGES = [
      { id:'productos', label:'Productos' },
      { id:'productos-inhabilitados', label:'Inhabilitados' },
      { id:'edicion-integral', label:'Edición integral' },
      { id:'cargar-productos', label:'Cargar productos' },
      { id:'ingreso-facturas', label:'Ingreso de facturas' },
      { id:'pre-entrada', label:'Pre entrada' },
      { id:'correccion-costos', label:'Corrección de costos' },
      { id:'facturas-ingresadas', label:'Facturas ingresadas' },
      { id:'traslados', label:'Traslados' },
      { id:'vencimientos', label:'Vencimientos' },
      { id:'bajas-inventario', label:'Bajas por desecho' }
    ];
    const tabs = document.getElementById('tabs');
    const main = document.getElementById('main');
    function render(id) {
      [...tabs.querySelectorAll('button')].forEach(b => b.setAttribute('aria-selected', b.dataset.id===id));
      const page = PAGES.find(p => p.id===id);
      main.innerHTML = `<div class="pair">
        <figure><figcaption>Antes · ${page.label}</figcaption>
          <img src="before/${id}.png" alt="Antes ${page.label}" onerror="this.parentElement.innerHTML='<figcaption>Antes · ${page.label}</figcaption><p class=empty>Pendiente</p>'" /></figure>
        <figure><figcaption>Después · ${page.label}</figcaption>
          <img src="after/${id}.png" alt="Después ${page.label}" onerror="this.parentElement.innerHTML='<figcaption>Después · ${page.label}</figcaption><p class=empty>Pendiente</p>'" /></figure>
      </div>`;
      history.replaceState(null,'','#'+id);
    }
    PAGES.forEach((p,i) => {
      const b = document.createElement('button');
      b.textContent = p.label; b.dataset.id = p.id; b.type='button';
      b.onclick = () => render(p.id);
      if (i===0) b.setAttribute('aria-selected','true');
      tabs.appendChild(b);
    });
    const start = (location.hash||'#productos').slice(1);
    render(PAGES.some(p=>p.id===start)?start:'productos');
  </script>
</body>
</html>
